<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compartilhamento de Tela</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Compartilhamento de Tela</h1>
<p class="subtitle">Entre em uma sala com o mesmo código de outra pessoa para conectar</p>

<div id="join-panel">
  <input id="name-input" type="text" placeholder="Seu nome" maxlength="30" />
  <input id="room-input" type="text" placeholder="Código da sala (ex: sala-123)" />
  <input id="password-input" type="password" placeholder="Senha da sala (opcional)" />
  <div class="field-hint">Se a sala ainda não existe, a senha que você digitar vira a senha dela. Se já existe, precisa ser a mesma senha de quem criou.</div>
  <button id="join-btn">Entrar na sala</button>
  <div id="rooms-list"></div>
</div>

<div id="room-panel">
  <div id="status-bar">
    <div><span id="status-dot"></span><span id="status-text">Conectando...</span></div>
    <div class="controls">
      <button id="mic-btn" class="secondary">🎤 Ativar microfone</button>
      <button id="share-btn">Compartilhar minha tela</button>
      <button id="stop-share-btn" class="danger" style="display:none;">Parar compartilhamento</button>
      <button id="leave-btn" class="secondary">Sair da sala</button>
    </div>
  </div>

  <div id="room-body">
    <div id="videos">
      <div class="video-box" id="screen-box">
        <div class="empty-hint" id="screen-hint">Aguardando alguém compartilhar a tela...</div>
        <video id="screen-video" autoplay playsinline style="display:none;"></video>
        <span class="video-label" style="display:none;" id="screen-label"></span>

        <div class="video-toolbar" id="video-toolbar" style="display:none;">
          <div class="volume-control" id="volume-control" style="display:none;">
            <button id="mute-btn" class="icon-btn" title="Mudo">
              <svg id="volume-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
              </svg>
            </button>
            <input id="volume-slider" type="range" min="0" max="100" value="100" title="Volume" />
          </div>
          <button id="fullscreen-btn" class="icon-btn" title="Tela cheia">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div id="participants-panel">
      <div class="participants-title">Participantes (<span id="participants-count">0</span>)</div>
      <div id="participants-list"></div>
    </div>
  </div>
</div>

<!-- Áudio dos outros participantes (voice chat) — sem controles visíveis,
     cada peer ganha o seu <audio> assim que a conexão de voz é criada. -->
<div id="voice-audio-sink" style="display:none;"></div>

<script src="client.js"></script>
</body>
</html>
